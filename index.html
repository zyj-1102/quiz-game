<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game 答题小游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quiz Game 知识答题</h1>
        <div class="quiz-box">
            <div class="question-text" id="question"></div>
            <div class="options" id="options-box"></div>
            <div class="score-area">得分：<span id="score">0</span></div>
            <button id="next-btn" class="next-btn">下一题</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
